name: Build ProjectNERV

on:
  workflow_dispatch:
  push:
    branches:
      - 'fifteen'

jobs:
  warmup-cache:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison lz4 libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore samloader-rs binary
        id: cache-samloader
        uses: actions/cache/restore@v5
        with:
          path: /usr/local/bin/samloader
          key: samloader-${{ runner.os }}-${{ hashFiles('patches/samloader-rs/0001-version-select.patch') }}

      - name: Restore build tools
        id: cache-tools
        uses: actions/cache/restore@v5
        with:
          path: out/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build_dependencies.sh') }}

      - name: Prepare pinned external dependencies
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          git clone --depth=1 https://github.com/salvogiangri/android-tools.git external/android-tools
          git -C external/android-tools fetch --depth=1 origin f29ad35e966897599e8d28c65c29ffe184fd6d74
          git -C external/android-tools checkout --detach f29ad35e966897599e8d28c65c29ffe184fd6d74
          git clone --depth=1 https://github.com/iBotPeaches/Apktool.git external/apktool
          git -C external/apktool fetch --depth=1 origin 3b487db20c568b8da122efb573a2b11f2aa8d790
          git -C external/apktool checkout --detach 3b487db20c568b8da122efb573a2b11f2aa8d790
          git clone --depth=1 https://github.com/sekaiacg/erofs-utils.git external/erofs-utils
          git -C external/erofs-utils fetch --depth=1 origin 620bf019a3eb6a9a2d8fa807a3034e5cc2b38d8a
          git -C external/erofs-utils checkout --detach 620bf019a3eb6a9a2d8fa807a3034e5cc2b38d8a
          git clone --depth=1 https://github.com/salvogiangri/img2sdat.git external/img2sdat
          git -C external/img2sdat fetch --depth=1 origin 601317ed0bf502eb8facdd048f2d75dc75ffcd53
          git -C external/img2sdat checkout --detach 601317ed0bf502eb8facdd048f2d75dc75ffcd53
          git clone --depth=1 https://github.com/ananjaser1211/samloader.git external/samloader
          git -C external/samloader fetch --depth=1 origin e174ea8a10a4fd80f7675337703cbb1ec8ef9b2d
          git -C external/samloader checkout --detach e174ea8a10a4fd80f7675337703cbb1ec8ef9b2d
          git clone --depth=1 https://github.com/salvogiangri/signapk.git external/signapk
          git -C external/signapk fetch --depth=1 origin 1c8c480c16aa2f05844c26bcd8d34d4f823d887a
          git -C external/signapk checkout --detach 1c8c480c16aa2f05844c26bcd8d34d4f823d887a

      - name: Build samloader-rs (with version selection patch)
        if: steps.cache-samloader.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs
          git checkout 1.2.0
          patch -p1 < "${{ github.workspace }}/patches/samloader-rs/0001-version-select.patch"
          cargo build --release
          cp target/release/samloader /usr/local/bin/samloader

      - name: Build dependencies
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh a52sxq
          ./scripts/build_dependencies.sh

      - name: Cache samloader-rs binary
        id: save-cache-samloader
        uses: actions/cache/save@v5
        with:
          path: /usr/local/bin/samloader
          key: samloader-${{ runner.os }}-${{ hashFiles('patches/samloader-rs/0001-version-select.patch') }}

      - name: Cache build tools
        id: save-cache-tools
        uses: actions/cache/save@v5
        with:
          path: out/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build_dependencies.sh') }}

  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a52sxq]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Restore build tools
        id: cache-tools
        uses: actions/cache/restore@v5
        with:
          path: out/tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/build_dependencies.sh') }}

      - name: Prepare pinned external dependencies
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          git clone --depth=1 https://github.com/salvogiangri/android-tools.git external/android-tools
          git -C external/android-tools fetch --depth=1 origin f29ad35e966897599e8d28c65c29ffe184fd6d74
          git -C external/android-tools checkout --detach f29ad35e966897599e8d28c65c29ffe184fd6d74
          git clone --depth=1 https://github.com/iBotPeaches/Apktool.git external/apktool
          git -C external/apktool fetch --depth=1 origin 3b487db20c568b8da122efb573a2b11f2aa8d790
          git -C external/apktool checkout --detach 3b487db20c568b8da122efb573a2b11f2aa8d790
          git clone --depth=1 https://github.com/sekaiacg/erofs-utils.git external/erofs-utils
          git -C external/erofs-utils fetch --depth=1 origin 620bf019a3eb6a9a2d8fa807a3034e5cc2b38d8a
          git -C external/erofs-utils checkout --detach 620bf019a3eb6a9a2d8fa807a3034e5cc2b38d8a
          git clone --depth=1 https://github.com/salvogiangri/img2sdat.git external/img2sdat
          git -C external/img2sdat fetch --depth=1 origin 601317ed0bf502eb8facdd048f2d75dc75ffcd53
          git -C external/img2sdat checkout --detach 601317ed0bf502eb8facdd048f2d75dc75ffcd53
          git clone --depth=1 https://github.com/ananjaser1211/samloader.git external/samloader
          git -C external/samloader fetch --depth=1 origin e174ea8a10a4fd80f7675337703cbb1ec8ef9b2d
          git -C external/samloader checkout --detach e174ea8a10a4fd80f7675337703cbb1ec8ef9b2d
          git clone --depth=1 https://github.com/salvogiangri/signapk.git external/signapk
          git -C external/signapk fetch --depth=1 origin 1c8c480c16aa2f05844c26bcd8d34d4f823d887a
          git -C external/signapk checkout --detach 1c8c480c16aa2f05844c26bcd8d34d4f823d887a

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld jq protobuf-compiler pcre2-utils webp \
            curl xxd patchelf flex bison lz4 libarchive-tools build-essential python3.12-venv device-tree-compiler
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/platform.x509.pem

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore samloader-rs binary
        id: cache-samloader
        uses: actions/cache/restore@v5
        with:
          path: /usr/local/bin/samloader
          key: samloader-${{ runner.os }}-${{ hashFiles('patches/samloader-rs/0001-version-select.patch') }}

      - name: Build samloader-rs (if not cached)
        if: steps.cache-samloader.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/topjohnwu/samloader-rs.git /tmp/samloader-rs
          cd /tmp/samloader-rs
          git checkout 1.2.0
          patch -p1 < "${{ github.workspace }}/patches/samloader-rs/0001-version-select.patch"
          cargo build --release
          cp target/release/samloader /usr/local/bin/samloader

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build dependencies (if not cached)
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Restore source firmware extraction cache
        id: cache-source-fw
        uses: actions/cache/restore@v5
        with:
          path: out/fw/SM-S911B_EUX
          key: source-fw-${{ matrix.target }}-SM-S911B-EUX-352404911234563

      - name: Restore source firmware download marker
        if: steps.cache-source-fw.outputs.cache-hit == 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-S911B_EUX"
          echo "352404911234563" > "$ODIN_DIR/SM-S911B_EUX/.downloaded"

      - name: Download source firmware
        if: steps.cache-source-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-S911B_EUX"
          THREADS=8
          for i in 1 2 3 4 5; do
            rm -rf "$ODIN_DIR/SM-S911B_EUX" && mkdir -p "$ODIN_DIR/SM-S911B_EUX"
            samloader download -m "SM-S911B" -r "EUX" -v "352404911234563" -j "$THREADS" -d "$ODIN_DIR/SM-S911B_EUX" && break
            echo "Attempt $i failed, retrying with $THREADS threads..."
            [ "$THREADS" -gt 1 ] && THREADS=$(( THREADS / 2 ))
            sleep 10
          done
          ZIP_FILE=$(find "$ODIN_DIR/SM-S911B_EUX" -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Download failed after 5 attempts"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d "$ODIN_DIR/SM-S911B_EUX" && rm -f "$ZIP_FILE"
          echo "352404911234563" > "$ODIN_DIR/SM-S911B_EUX/.downloaded"

      - name: Extract source firmware
        if: steps.cache-source-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-target

      - name: Save source firmware extraction cache
        if: steps.cache-source-fw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: out/fw/SM-S911B_EUX
          key: source-fw-${{ matrix.target }}-SM-S911B-EUX-352404911234563

      - name: Restore target firmware extraction cache
        id: cache-target-fw
        uses: actions/cache/restore@v5
        with:
          path: out/fw/SM-A528B_BTU
          key: target-fw-${{ matrix.target }}-SM-A528B-BTU-352599501234566

      - name: Restore target firmware download marker
        if: steps.cache-target-fw.outputs.cache-hit == 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-A528B_BTU"
          echo "352599501234566" > "$ODIN_DIR/SM-A528B_BTU/.downloaded"

      - name: Download A52s firmware
        if: steps.cache-target-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          mkdir -p "$ODIN_DIR/SM-A528B_BTU"
          THREADS=8
          for i in 1 2 3 4 5; do
            rm -rf "$ODIN_DIR/SM-A528B_BTU" && mkdir -p "$ODIN_DIR/SM-A528B_BTU"
            samloader download -m "SM-A528B" -r "BTU" -v "352599501234566" -j "$THREADS" -d "$ODIN_DIR/SM-A528B_BTU" && break
            echo "Attempt $i failed, retrying with $THREADS threads..."
            [ "$THREADS" -gt 1 ] && THREADS=$(( THREADS / 2 ))
            sleep 10
          done
          ZIP_FILE=$(find "$ODIN_DIR/SM-A528B_BTU" -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Download failed after 5 attempts"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d "$ODIN_DIR/SM-A528B_BTU" && rm -f "$ZIP_FILE"
          echo "352599501234566" > "$ODIN_DIR/SM-A528B_BTU/.downloaded"

      - name: Extract target firmware
        if: steps.cache-target-fw.outputs.cache-hit != 'true'
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh --ignore-source

      - name: Save target firmware extraction cache
        if: steps.cache-target-fw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: out/fw/SM-A528B_BTU
          key: target-fw-${{ matrix.target }}-SM-A528B-BTU-352599501234566

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh

      - name: Upload to GoFile
        run: |
          SERVER=$(curl -s "https://api.gofile.io/servers" | jq -r '.data.servers[0].name')
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*.zip" | head -n 1)
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER_ID }}" "https://${SERVER}.gofile.io/contents/uploadfile")
          echo "Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'
